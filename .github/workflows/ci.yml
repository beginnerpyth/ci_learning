name: CI

on:
  push:
    branches:
      - main
      - feature/new
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Check Ruff
        run: ruff --version

      - name: Run tests
        env:
          DATABASE: ${{ secrets.DATABASE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pytest

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/new'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          echo "$TOKEN" | python3 -c "
          import sys,base64,json
          p=sys.stdin.read().split('.')[1]
          p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print({k:c.get(k) for k in ('sub','aud','iss','repository','ref','event_name')})
          "

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::157693542014:role/github-actions-ecr-role
          aws-region: ap-southeast-2

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: 157693542014.dkr.ecr.ap-southeast-2.amazonaws.com/newapp_latest:latest
            - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: i-PUT-YOUR-REAL-ID-HERE
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "i-03bc4707f8d6374df" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy from GitHub Actions" \
            --parameters 'commands=["sudo -u ec2-user bash -c \"cd /home/ec2-user && aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 157693542014.dkr.ecr.ap-southeast-2.amazonaws.com && docker compose pull api && docker compose up -d && docker image prune -f\""]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}"

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
          [ "$STATUS" = "Success" ]
