name: CI

on:
  push:
    branches:
      - main
      - feature/new
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Check Ruff
        run: ruff --version

      - name: Run tests
        env:
          DATABASE: ${{ secrets.DATABASE }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: pytest

      - name: Run linter
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/new'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::157693542014:role/github-actions-ecr-role
          aws-region: ap-southeast-2

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: 157693542014.dkr.ecr.ap-southeast-2.amazonaws.com/uni_project_rbac:latest